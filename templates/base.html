<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#121f27">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}SG Quant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}?v=20260919b">
</head>
<body class="page-{{ page or 'base' }}">
  <div class="top-shell">
    <section id="marketBanner" class="market-banner" data-regime="unknown" aria-live="polite">
      <div class="market-primary">
        <div class="market-verdict">
          <span class="market-caption">上证判定</span>
          <strong id="marketMainLabel">市场状态待更新</strong>
        </div>
        <div class="market-strength">
          <span id="marketMainScore" class="market-score">—</span>
          <div class="market-thermometer" aria-hidden="true">
            <span class="market-thumb"></span>
          </div>
          <div class="market-scale"><span>熊</span><span>震荡</span><span>牛</span></div>
        </div>
      </div>
      <div id="marketIndices" class="market-indices">
        <span class="market-index-placeholder">正在读取上证、深证、创业板与科创50…</span>
      </div>
      <span id="marketAsOf" class="market-asof">—</span>
    </section>
    <header class="site-header">
      <a class="brand" href="{{ url_for('index') }}" aria-label="SG Quant 首页">
        <span class="brand-mark">SG</span>
        <span class="brand-copy"><b>QUANT</b><small>A 股研究台</small></span>
      </a>
      <nav class="nav" aria-label="主导航">
        <a class="{{ 'active' if page == 'dashboard' else '' }}" href="{{ url_for('index') }}">榜单与进度</a>
        <a class="{{ 'active' if page == 'news' else '' }}" href="{{ url_for('news_page') }}">财经新闻</a>
        <a class="{{ 'active' if page == 'summary' else '' }}" href="{{ url_for('summary_page') }}">每日总结</a>
        <a class="{{ 'active' if page == 'chat' else '' }}" href="{{ url_for('chat_page') }}">数据问答</a>
      </nav>
      <form class="logout-form" method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="ghost small" type="submit">退出</button>
      </form>
    </header>
  </div>
  <main class="wrap">{% block content %}{% endblock %}</main>
  <nav class="mobile-tabbar" aria-label="移动端主导航">
    <a class="{{ 'active' if page == 'dashboard' else '' }}" href="{{ url_for('index') }}" aria-label="榜单与进度">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      <span>榜单</span>
    </a>
    <a class="{{ 'active' if page == 'news' else '' }}" href="{{ url_for('news_page') }}" aria-label="财经新闻">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h13v14H6a2 2 0 0 1-2-2V5z"/><path d="M17 8h2a1 1 0 0 1 1 1v8a2 2 0 0 1-2 2"/><path d="M7 9h6"/><path d="M7 13h6"/></svg>
      <span>新闻</span>
    </a>
    <a class="{{ 'active' if page == 'summary' else '' }}" href="{{ url_for('summary_page') }}" aria-label="每日总结">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h9l4 4v16H6V2z"/><path d="M15 2v4h4"/><path d="M9 12h7"/><path d="M9 16h7"/></svg>
      <span>总结</span>
    </a>
    <a class="{{ 'active' if page == 'chat' else '' }}" href="{{ url_for('chat_page') }}" aria-label="数据问答">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/><path d="M9 11h6"/><path d="M9 14h4"/></svg>
      <span>问答</span>
    </a>
  </nav>
  <script>
    window.SGQ = {
      csrf: document.querySelector('meta[name="csrf-token"]').content,
      async api(url, options = {}) {
        const next = {...options};
        next.headers = {...(next.headers || {})};
        if (next.method && next.method.toUpperCase() !== 'GET') {
          next.headers['X-CSRF-Token'] = this.csrf;
        }
        if (next.body && !next.headers['Content-Type']) next.headers['Content-Type'] = 'application/json';
        const response = await fetch(url, next);
        if (response.status === 401) { location.href = '/login'; throw new Error('请先登录'); }
        return response;
      },
      escape(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        })[char]);
      },
      inlineMarkdown(value) {
        const codeSpans = [];
        const protectedText = String(value ?? '').replace(/`([^`\n]+)`/g, (_match, code) => {
          const token = `\u0000CODE${codeSpans.length}\u0000`;
          codeSpans.push(`<code>${this.escape(code)}</code>`);
          return token;
        });
        return this.escape(protectedText)
          .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
          .replace(/__([^_\n]+)__/g, '<strong>$1</strong>')
          .replace(/\u0000CODE(\d+)\u0000/g, (_match, index) => codeSpans[Number(index)] || '');
      },
      renderMarkdown(markdown) {
        const output = [];
        let paragraph = [];
        let listType = '';
        let codeLines = [];
        let inCodeBlock = false;
        const closeParagraph = () => {
          if (paragraph.length) output.push(`<p>${this.inlineMarkdown(paragraph.join(' '))}</p>`);
          paragraph = [];
        };
        const closeList = () => {
          if (listType) output.push(`</${listType}>`);
          listType = '';
        };
        const closeCodeBlock = () => {
          if (inCodeBlock) output.push(`<pre><code>${this.escape(codeLines.join('\n'))}</code></pre>`);
          codeLines = [];
          inCodeBlock = false;
        };
        for (const rawLine of String(markdown ?? '').split(/\r?\n/)) {
          const line = rawLine.trim();
          if (line.startsWith('```')) {
            if (inCodeBlock) closeCodeBlock();
            else {
              closeParagraph();
              closeList();
              inCodeBlock = true;
            }
            continue;
          }
          if (inCodeBlock) {
            codeLines.push(rawLine);
            continue;
          }
          if (!line) {
            closeParagraph();
            closeList();
            continue;
          }
          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            closeParagraph();
            closeList();
            const level = Math.min(heading[1].length + 1, 4);
            output.push(`<h${level}>${this.inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }
          const unordered = line.match(/^[-*+]\s+(.+)$/);
          const ordered = line.match(/^\d+[.)]\s+(.+)$/);
          if (unordered || ordered) {
            closeParagraph();
            const nextType = ordered ? 'ol' : 'ul';
            if (listType !== nextType) {
              closeList();
              output.push(`<${nextType}>`);
              listType = nextType;
            }
            output.push(`<li>${this.inlineMarkdown((unordered || ordered)[1])}</li>`);
            continue;
          }
          const quote = line.match(/^>\s?(.*)$/);
          if (quote) {
            closeParagraph();
            closeList();
            output.push(`<blockquote>${this.inlineMarkdown(quote[1])}</blockquote>`);
            continue;
          }
          closeList();
          paragraph.push(line);
        }
        closeParagraph();
        closeList();
        closeCodeBlock();
        return output.join('');
      },
      localTime(value) {
        if (!value) return '时间未知';
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? value : date.toLocaleString('zh-CN', {hour12:false});
      }
    };

    async function loadMarketOverview() {
      try {
        const response = await SGQ.api('/api/market_overview');
        const data = await response.json();
        const banner = document.getElementById('marketBanner');
        const score = Math.max(0, Math.min(100, Number(data.score ?? 50)));
        const hue = Math.max(0, Math.min(138, Number(data.color_hue ?? 48)));
        banner.dataset.regime = data.regime || 'unknown';
        banner.style.setProperty('--market-hue', hue);
        banner.style.setProperty('--market-score', `${score}%`);
        document.getElementById('marketMainLabel').textContent = data.label || '待更新';
        document.getElementById('marketMainScore').textContent = `强度 ${score.toFixed(0)} / 100`;
        const indices = data.indices || [];
        document.getElementById('marketIndices').innerHTML = indices.length ? indices.map(item => {
          const change = Number(item.change_pct || 0);
          const point = Number(item.close || 0);
          const idxHue = Math.max(0, Math.min(138, Number(item.color_hue ?? 48)));
          const idxScore = Math.max(0, Math.min(100, Number(item.score ?? 50)));
          return `<span class="market-index-mini" data-regime="${SGQ.escape(item.regime || 'unknown')}" style="--idx-hue:${idxHue}" title="强度 ${idxScore.toFixed(1)} / 100">
            <span class="market-index-name"><b>${SGQ.escape(item.name)}</b><i>${SGQ.escape(item.label || '待更新')} ${Number.isFinite(idxScore) ? idxScore.toFixed(0) : ''}</i></span>
            <em>${point ? point.toFixed(2) : '—'}</em>
            <small class="${change > 0 ? 'up' : change < 0 ? 'down' : ''}">${point ? `${change >= 0 ? '+' : ''}${change.toFixed(2)}%` : '—'}</small>
          </span>`;
        }).join('') : '<span class="market-index-placeholder">尚无四指数缓存，请先执行全市场流程。</span>';
        document.getElementById('marketAsOf').textContent = data.market_date
          ? `行情 ${data.market_date}` : '数据待更新';
      } catch (error) {
        document.getElementById('marketMainLabel').textContent = '市场状态读取失败';
      }
    }
    loadMarketOverview();
    setInterval(loadMarketOverview, 30000);
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
